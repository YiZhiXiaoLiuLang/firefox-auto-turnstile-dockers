name: turnstile-x8

services:
  gateway:
    image: ghcr.io/yizhixiaoliulang/firefox-auto-turnstile-dockers-gateway:latest
    container_name: turnstile-gateway
    network_mode: host
    # host 网络下网关直接监听宿主 8081，不走 docker 端口映射；
    # 代价是解析不了 compose 服务名，workers 改经宿主端口访问（见 WORKERS）。
    environment:
      TZ: UTC
      WORKERS: worker-1:127.0.0.1:18081,worker-2:127.0.0.1:18082,worker-3:127.0.0.1:18083,worker-4:127.0.0.1:18084,worker-5:127.0.0.1:18085,worker-6:127.0.0.1:18086,worker-7:127.0.0.1:18087,worker-8:127.0.0.1:18088
      COORDS_SYNC_DIR: /shared-coords
      SYNC_INTERVAL: "3"
    volumes:
      - shared-coords:/shared-coords
    depends_on:
      - worker-1
      - worker-2
      - worker-3
      - worker-4
      - worker-5
      - worker-6
      - worker-7
      - worker-8
    restart: unless-stopped

  # 每加一个 worker 按此模板复制：服务名/host 改为 worker-N，
  # noVNC 宿主端口依次顺延，
  # 并在 gateway 的 WORKERS 里追加 worker-N:worker-N:8081。
  worker-1:
    image: ghcr.io/yizhixiaoliulang/firefox-auto-turnstile:latest
    container_name: turnstile-worker-1
    shm_size: "2g"
    environment:
      TZ: UTC
      DISPLAY_WIDTH: "1280"
      DISPLAY_HEIGHT: "800"
      # NAT4 内网直接暴露；如需密码取消下一行注释
      # VNC_PASSWORD: changeme
    volumes:
      - worker-data-1:/config
      - shared-coords:/shared-coords/worker-1
    ports:
      - "127.0.0.1:18081:8081"
      - "5802:5800"
    restart: unless-stopped

  worker-2:
    image: ghcr.io/yizhixiaoliulang/firefox-auto-turnstile:latest
    container_name: turnstile-worker-2
    shm_size: "2g"
    environment:
